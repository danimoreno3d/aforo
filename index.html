<!doctype html>
<!-- fluxus-pagina: 6 huella: babc31297d29 -->
<!-- Sube el numero al cambiar esta pagina en el programa: el equipo
     solo sustituye la publicada si la suya es mas nueva. Si editas
     esto a mano en GitHub, deja el numero como esta y no te lo
     pisara. La huella es del resto del fichero: si cambias la pagina
     sin subir el numero, el autotest lo detecta y te dice la nueva. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aforo de la sala · Fluxus</title>
<style>
  :root {
    --fondo: #f4f6f9; --panel: #ffffff; --borde: #e2e6ec;
    --tinta: #1f2733; --tinta-2: #5a6472; --tinta-3: #8a94a3;
    --acento: #2a6fb0;
    /* Una sola tonalidad en tres intensidades. Se distinguen por claridad,
       no por color, asi que siguen leyendose con cualquier daltonismo. */
    --n1: #bcd4ea; --n2: #6ba3d6; --n3: #24628f;
    --ahora: #d96e30;
    --sombra: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #14171c; --panel: #1a1e25; --borde: #262c35;
      --tinta: #e4e9f0; --tinta-2: #9aa5b5; --tinta-3: #6b7686;
      --acento: #5a9fe0;
      --n1: #3d5a78; --n2: #5e93cb; --n3: #9dcbf5;
      --ahora: #e0894a;
      --sombra: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 20px; line-height: 1.5;
  }
  .envoltorio { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  h1 { font-size: 1.35rem; margin: 0; font-weight: 700; letter-spacing: -.2px; }
  .sub { color: var(--tinta-3); font-size: .85rem; }
  .tarjeta { background: var(--panel); border: 1px solid var(--borde);
             border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra);
             margin-bottom: 14px; }

  /* --- estado actual --- */
  .ahora-linea { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bolita { width: 15px; height: 15px; border-radius: 50%; flex: none; }
  .ahora-txt { font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800;
               line-height: 1.15; letter-spacing: -.4px; }
  .ahora-cmp { color: var(--tinta-2); font-size: .95rem; margin-top: 6px; }
  .ahora-num { font-size: clamp(1.5rem, 6vw, 2.1rem); font-weight: 800;
               line-height: 1.15; letter-spacing: -.4px; color: var(--acento);
               font-variant-numeric: tabular-nums; }
  .etiqueta { font-size: .7rem; font-weight: 700; letter-spacing: 1.4px;
              color: var(--tinta-3); text-transform: uppercase; margin-bottom: 10px; }

  /* --- selector de dia --- */
  .dias { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .dias button {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    padding: 7px 0; width: 44px; border-radius: 9px;
    border: 1px solid var(--borde); background: transparent; color: var(--tinta-2);
    transition: background .15s, color .15s, border-color .15s;
  }
  .dias button:hover { border-color: var(--acento); color: var(--acento); }
  .dias button[aria-pressed="true"] {
    background: var(--acento); border-color: var(--acento); color: #fff;
  }
  @media (prefers-color-scheme: dark) {
    .dias button[aria-pressed="true"] { color: #101418; }
  }

  /* --- grafica de barras --- */
  .grafica { display: flex; align-items: flex-end; gap: var(--hueco, 3px);
             height: 160px; margin-bottom: 4px; }
  .col { flex: 1 1 0; display: flex; flex-direction: column;
         justify-content: flex-end; height: 100%; min-width: 0; }
  .barra { border-radius: 4px 4px 2px 2px; width: 100%;
           transition: height .45s cubic-bezier(.2,.8,.3,1); }
  .col.es-ahora { background: rgba(217,110,48,.13); border-radius: 5px; }
  .col.es-ahora .barra { box-shadow: inset 0 0 0 2px var(--ahora); }
  @media (prefers-color-scheme: dark) {
    .col.es-ahora { background: rgba(224,137,74,.16); }
  }
  .col { cursor: default; }
  /* Resaltado: se aclara la barra y se marca la columna, para que se vea
     cual se esta consultando incluso con barras de 4 px. */
  /* Tiene que distinguirse de .es-ahora, que marca la hora actual en
     naranja: el resaltado usa el color de acento y un contorno claro en la
     barra, porque un fondo tenue no se ve sobre una barra alta y brillante. */
  .col.mirada { background: color-mix(in srgb, var(--acento) 30%, transparent);
                border-radius: 5px; }
  .col.mirada .barra { filter: brightness(1.25) saturate(1.15);
                       box-shadow: inset 0 0 0 2px var(--tinta); }
  @supports not (background: color-mix(in srgb, red 10%, transparent)) {
    .col.mirada { background: rgba(128, 128, 128, .34); }
  }

  .globo {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--tinta); color: var(--fondo);
    border-radius: 9px; padding: 8px 11px; font-size: .78rem;
    line-height: 1.45; white-space: nowrap; opacity: 0;
    transition: opacity .12s; box-shadow: 0 4px 14px rgba(0,0,0,.28);
  }
  .globo.visible { opacity: 1; }
  .globo b { font-size: .9rem; }
  .globo .gente { color: var(--acento); font-weight: 700; }
  #zona-grafica { position: relative; }

  /* Barra con uno o dos dias de datos: se ve, pero se ve que es floja. */
  .barra.pocos { opacity: .45; }
  .rango-semana { font-size: .78rem; opacity: .7; margin: -2px 0 8px; }
  .horas { display: flex; gap: var(--hueco, 3px); }
  .horas span { flex: 1 1 0; text-align: center; font-size: .68rem;
                color: var(--tinta-3); font-variant-numeric: tabular-nums;
                min-width: 0; overflow: visible; white-space: nowrap; }
  .horas span.es-ahora { color: var(--ahora); font-weight: 700; }

  .leyenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem;
             color: var(--tinta-2); margin-top: 18px;
             border-top: 1px solid var(--borde); padding-top: 14px; }
  .punto { width: 11px; height: 11px; border-radius: 3px; display: inline-block;
           vertical-align: -1px; margin-right: 6px; }

  .vacio { color: var(--tinta-3); font-size: .9rem; padding: 34px 0;
           text-align: center; }
  .aviso { background: var(--panel); border: 1px solid var(--borde);
           border-left: 3px solid var(--ahora); border-radius: 10px;
           padding: 14px 18px; color: var(--tinta-2); font-size: .9rem;
           margin-bottom: 14px; }
  footer { margin-top: 20px; color: var(--tinta-3); font-size: .78rem; }
  footer p { margin: 4px 0; }
  .oculto { display: none; }
</style>
</head>
<body>
<div class="envoltorio">

  <header>
    <h1 id="titulo">Aforo de la sala</h1>
    <div class="sub" id="subtitulo">Cargando…</div>
  </header>

  <div class="aviso oculto" id="aviso"></div>

  <div class="tarjeta">
    <div class="etiqueta">Ahora mismo</div>
    <div class="ahora-linea">
      <span class="bolita" id="ahora-bola"></span>
      <span class="ahora-txt" id="ahora-txt">—</span>
      <span class="ahora-num" id="ahora-num"></span>
    </div>
    <div class="ahora-cmp" id="ahora-cmp"></div>
  </div>

  <div class="tarjeta">
    <div class="etiqueta" id="titulo-grafica">Horas con más gente</div>
    <div class="rango-semana oculto" id="rango-semana"></div>
    <div class="dias" id="dias" role="group" aria-label="Día de la semana"></div>
    <div id="zona-grafica">
      <div class="grafica" id="grafica"></div>
      <div class="horas" id="horas"></div>
      <div class="globo" id="globo" role="status" aria-live="polite"></div>
    </div>
    <div class="vacio oculto" id="sin-datos">Todavía no hay datos suficientes de este día.</div>
    <div class="leyenda" id="leyenda">
      <span><span class="punto" style="background:var(--n1)"></span><span id="ley-1">Poca gente</span></span>
      <span><span class="punto" style="background:var(--n2)"></span><span id="ley-2">Gente moderada</span></span>
      <span><span class="punto" style="background:var(--n3)"></span><span id="ley-3">Mucha gente</span></span>
    </div>
  </div>

  <footer>
    <p id="pie-1">Se actualiza automáticamente cada pocos minutos.</p>
    <p id="pie-2">Muestra lo concurrida que suele estar la sala comparada
       consigo misma, no el número de personas.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var NOMBRES  = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var CORTOS   = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  // Valores por defecto. Se sustituyen por los que traiga el JSON en
  // aplicarPanel(), asi que cambiar el aspecto del panel no obliga a volver
  // a subir este fichero: basta con tocarlo en el programa y republicar.
  var NIVELES  = ['Cerrado ahora','Poca gente','Gente moderada','Mucha gente'];
  var COLORES  = ['var(--borde)','var(--n1)','var(--n2)','var(--n3)'];

  var datos = null;
  var diaVisible = null;

  function el(id) { return document.getElementById(id); }
  function texto(id, t) { var n = el(id); if (n) n.textContent = t; }

  function aplicarPanel(p) {
    if (!p) { return; }

    // Tema: 'auto' respeta lo que tenga el visitante; claro u oscuro fuerzan.
    // Se fuerza pisando las variables en :root, que gana sobre la media query
    // de prefers-color-scheme sin tener que duplicar el CSS.
    var oscuroSO = window.matchMedia &&
                   window.matchMedia('(prefers-color-scheme: dark)').matches;
    var oscuro = p.tema === 'oscuro' || (p.tema !== 'claro' && oscuroSO);
    var raiz = document.documentElement;
    if (p.tema === 'claro' || p.tema === 'oscuro') {
      var pal = oscuro
        ? {fondo:'#14171c', panel:'#1a1e25', borde:'#262c35',
           tinta:'#e4e9f0', 'tinta-2':'#9aa5b5', 'tinta-3':'#6b7686'}
        : {fondo:'#f4f6f9', panel:'#ffffff', borde:'#e2e6ec',
           tinta:'#1f2733', 'tinta-2':'#5a6472', 'tinta-3':'#8a94a3'};
      Object.keys(pal).forEach(function (k) {
        raiz.style.setProperty('--' + k, pal[k]);
      });
      if (oscuro) { raiz.style.setProperty('--sombra', 'none'); }
    }

    if (p.acento) { raiz.style.setProperty('--acento', p.acento); }
    var tonos = oscuro ? p.tonos_oscuro : p.tonos_claro;
    if (tonos && tonos.length === 3) {
      raiz.style.setProperty('--n1', tonos[0]);
      raiz.style.setProperty('--n2', tonos[1]);
      raiz.style.setProperty('--n3', tonos[2]);
      COLORES = ['var(--borde)', tonos[0], tonos[1], tonos[2]];
    }

    if (p.etiquetas && p.etiquetas.length === 4) {
      NIVELES = p.etiquetas;
      texto('ley-1', NIVELES[1]);
      texto('ley-2', NIVELES[2]);
      texto('ley-3', NIVELES[3]);
    }
    if (p.pie_1) { texto('pie-1', p.pie_1); }
    if (p.pie_2) { texto('pie-2', p.pie_2); }
  }

  // Cuantos minutos sin renovarse hacen que los datos dejen de valer.
  // 45 min es holgado: la publicacion va cada 5, asi que hacen falta nueve
  // ciclos seguidos fallando para que salte por error.
  var MINUTOS_VIEJO = 45;

  // El propio fichero dice si el aforo publicado es de ahora o no: lo
  // calcula quien lo genera, que es el unico que sabe cuando fue el ultimo
  // paso por la puerta. La cuenta de los 45 minutos se mantiene como red de
  // seguridad para ficheros generados por una version anterior.
  function aforoCaducado() {
    return datos && datos.caducado === true;
  }

  function datosViejos() {
    var g = datos && datos.generado ? new Date(datos.generado) : null;
    if (!g || isNaN(g.getTime())) { return false; }
    return (Date.now() - g.getTime()) > MINUTOS_VIEJO * 60 * 1000;
  }

  // ------------------------------------------------------------------
  // EL HORARIO DEL TALLER
  //
  // Fuera del horario el equipo duerme a proposito (noches y dias que no
  // abre), asi que el aforo.json que hay es el del ultimo cierre. Sin esto la
  // pagina lo veia viejo y decia "No disponible, puede que el equipo este
  // apagado" todo el fin de semana. Con el horario dentro del JSON, la
  // pagina sabe que esta cerrado y lo dice, sin depender de que nadie
  // publique.

  function sumarDias(iso, n) {
    var d = new Date(iso + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function aMinutos(hhmm) {
    var p = String(hhmm || '').split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10);
  }

  // La hora de la SALA, no la de quien mira: el desfase va en "generado"
  // (por ejemplo +02:00). Sin el, la del navegador.
  function relojSala() {
    var ahora = new Date();
    var m = datos && datos.generado
      ? /([+-])(\d\d):(\d\d)$/.exec(datos.generado) : null;
    var desfase = m
      ? (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10))
      : -ahora.getTimezoneOffset();
    var sala = new Date(ahora.getTime() + desfase * 60000);
    var min = sala.getUTCHours() * 60 + sala.getUTCMinutes();
    var wd = (sala.getUTCDay() + 6) % 7;
    var fecha = sala.toISOString().slice(0, 10);
    // La fecha de la JORNADA: antes del corte (las 05:00) aun es la de ayer.
    var corte = ((datos && datos.horario && datos.horario.corte) || 5) * 60;
    var antes = min < corte;
    return {min: min, wd: wd,
            fechaOp: antes ? sumarDias(fecha, -1) : fecha,
            wdOp: antes ? (wd + 6) % 7 : wd};
  }

  // true abierto, false cerrado por horario, null si no hay horario.
  function abiertoPorHorario() {
    var h = datos && datos.horario;
    if (!h || !h.dias || !h.inicio || !h.fin) { return null; }
    var ini = aMinutos(h.inicio), fin = aMinutos(h.fin);
    if (isNaN(ini) || isNaN(fin) || ini === fin) { return null; }
    var r = relojSala();
    var abre = function (d) { return h.dias.indexOf(d) >= 0; };
    if (ini < fin) { return abre(r.wd) && r.min >= ini && r.min < fin; }
    // Turno de noche: es del dia en que empieza.
    if (r.min >= ini) { return abre(r.wd); }
    if (r.min < fin) { return abre((r.wd + 6) % 7); }
    return false;
  }

  // "Abre mañana a las 08:50." Para que "Cerrado" diga tambien cuando no.
  function proximaApertura() {
    var h = datos && datos.horario;
    if (!h || !h.dias || !h.dias.length) { return ''; }
    var r = relojSala(), ini = aMinutos(h.inicio);
    var dias = ['el lunes', 'el martes', 'el miércoles', 'el jueves',
                'el viernes', 'el sábado', 'el domingo'];
    for (var k = 0; k < 8; k++) {
      var d = (r.wd + k) % 7;
      if (h.dias.indexOf(d) < 0 || (k === 0 && r.min >= ini)) { continue; }
      var cuando = k === 0 ? 'hoy' : (k === 1 ? 'mañana' : dias[d]);
      return 'Abre ' + cuando + ' a las ' + h.inicio + '.';
    }
    return '';
  }

  function minutosDesdeApertura() {
    var h = datos && datos.horario;
    if (!h || !h.inicio) { return null; }
    var d = relojSala().min - aMinutos(h.inicio);
    return d < 0 ? d + 1440 : d;
  }

  // EL LUNES EMPIEZA DE CERO AUNQUE EL EQUIPO DUERMA.
  //
  // La grafica de la semana la monta el equipo al publicar. El lunes a las
  // 07:00 el equipo aun duerme y el fichero es el del viernes: sin esto la
  // pagina ensenaba la semana pasada hasta la primera publicacion. Y el
  // sabado, "hoy" seria el viernes del fichero. Se ajusta con el reloj de la
  // sala: semana nueva vacia si ya ha pasado, y hoy, futuros y cerrados al dia.
  function ajustarSemana() {
    if (datos.grafica !== 'semana' || !datos.semana_desde ||
        !datos.semana_hasta || !datos.semana) { return; }
    var r = relojSala();
    if (r.fechaOp < datos.semana_desde) { return; }
    if (r.fechaOp > datos.semana_hasta) {
      var lunes = sumarDias(r.fechaOp, -r.wdOp);
      datos.semana = NOMBRES.map(function (n, i) {
        return {dia: n, fecha: sumarDias(lunes, i), horas: []};
      });
      datos.semana_desde = lunes;
      datos.semana_hasta = sumarDias(lunes, 6);
    }
    var dias = datos.horario && datos.horario.dias;
    datos.semana.forEach(function (d, i) {
      var f = d.fecha || sumarDias(datos.semana_desde, i);
      d.futuro = f > r.fechaOp;
      if (dias) { d.cerrado = dias.indexOf(i) < 0; }
    });
    datos.dia = r.wdOp;
  }

  // El dia que se ensena al entrar: hoy, salvo que hoy no abra y no tenga
  // nada (un sabado): entonces el ultimo dia de la semana con datos.
  function diaInicial() {
    var hoy = datos.semana && datos.semana[datos.dia];
    if (hoy && hoy.cerrado && !(hoy.horas || []).length) {
      for (var i = datos.dia - 1; i >= 0; i--) {
        if ((datos.semana[i].horas || []).length) { return i; }
      }
    }
    return datos.dia;
  }

  function pintarSelector() {
    var cont = el('dias');
    cont.innerHTML = '';
    CORTOS.forEach(function (nombre, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = nombre;
      b.setAttribute('aria-pressed', i === diaVisible ? 'true' : 'false');
      b.setAttribute('aria-label', NOMBRES[i]);
      b.addEventListener('click', function () {
        diaVisible = i;
        pintarSelector();
        pintarGrafica();
      });
      cont.appendChild(b);
    });
  }

  function pintarGrafica() {
    var grafica = el('grafica'), horas = el('horas');
    var dia = (datos.semana || [])[diaVisible];
    var lista = (dia && dia.horas) || [];

    // Modo "semana": la grafica es lo que ha pasado ESTA semana, y empieza
    // de cero cada lunes. Se dice en el titulo y con las fechas, para que
    // nadie la lea como "lo que suele pasar".
    var enSemana = datos.grafica === 'semana';
    texto('titulo-grafica', enSemana ? 'Esta semana' : 'Horas con más gente');
    var rango = el('rango-semana');
    if (enSemana && datos.semana_desde && datos.semana_hasta) {
      var d1 = new Date(datos.semana_desde + 'T12:00:00');
      var d2 = new Date(datos.semana_hasta + 'T12:00:00');
      var fmt = {day: 'numeric', month: 'long'};
      rango.textContent = 'Del ' + d1.toLocaleDateString('es-ES', fmt) +
        ' al ' + d2.toLocaleDateString('es-ES', fmt);
      rango.classList.remove('oculto');
    } else {
      rango.classList.add('oculto');
    }

    var hayDatos = lista.length > 0;
    el('zona-grafica').classList.toggle('oculto', !hayDatos);
    el('sin-datos').classList.toggle('oculto', hayDatos);
    if (!hayDatos) {
      var vacio = 'Todavía no hay datos suficientes de este día.';
      if (dia && dia.cerrado) {
        vacio = 'El taller no abre este día.';
      } else if (enSemana) {
        vacio = (dia && dia.futuro) ? 'Este día todavía no ha llegado.'
              : (diaVisible === datos.dia ? 'Todavía no hay datos de hoy.'
              : 'Ese día no hubo datos.');
      }
      texto('sin-datos', vacio);
      return;
    }

    // El globo apunta a una columna concreta; al repintar (cambio de dia o
    // refresco de datos cada pocos minutos) esas columnas se destruyen y el
    // globo se quedaba flotando sobre una barra que ya no es la suya.
    ocultarGlobo();

    grafica.innerHTML = '';
    horas.innerHTML = '';
    var esHoy = diaVisible === datos.dia;

    // El hueco entre barras se estrecha cuando hay muchas: con franjas de 5
    // minutos son casi 180 barras y 3px de separacion se comerian el ancho.
    var hueco = lista.length > 120 ? '1px' : (lista.length > 60 ? '2px' : '3px');
    document.documentElement.style.setProperty('--hueco', hueco);

    // La franja "de ahora" ya no es la hora en punto: hay que comparar hora
    // y minuto contra el tamano de franja que traiga el JSON.
    var res = datos.resolucion_min || 60;
    var minAhora = Math.floor((datos.hora * 60 + (datos.minuto || 0)) / res) * res;

    // Con muchas barras no caben todas las etiquetas. Se rotula solo en hora
    // en punto, y si aun asi no caben, cada 2 o 3 horas.
    var porHora = Math.max(1, Math.round(60 / res));
    var horasVisibles = Math.ceil(lista.length / porHora);
    var anchoUtil = grafica.clientWidth || 700;
    var cadaCuantas = 1;
    if (horasVisibles * 22 > anchoUtil) { cadaCuantas = 2; }
    if (horasVisibles * 14 > anchoUtil) { cadaCuantas = 3; }

    lista.forEach(function (h, i) {
      var min = h.h * 60 + (h.m || 0);
      var ahora = esHoy && min === minAhora;

      var col = document.createElement('div');
      col.className = 'col' + (ahora ? ' es-ahora' : '');

      var barra = document.createElement('div');
      // Poco apoyo: la barra sale de uno o dos dias, no de "lo que suele
      // pasar". Se dibuja mas floja para no afirmar lo que no se sabe, pero
      // se dibuja: antes estas franjas se quitaban y desaparecian dias
      // enteros de la grafica.
      barra.className = 'barra' + (h.pocos ? ' pocos' : '');
      // Un minimo visible: una hora abierta pero tranquila no debe
      // confundirse con una hora en la que la sala esta cerrada.
      barra.style.height = Math.max(3, h.rel) + '%';
      barra.style.background = COLORES[h.n] || COLORES[0];
      barra.setAttribute('role', 'img');
      var reloj = ('0' + h.h).slice(-2) + ':' + ('0' + (h.m || 0)).slice(-2);
      barra.setAttribute('aria-label',
        reloj + ' — ' + (NIVELES[h.n] || NIVELES[0])
        + (h.pocos ? ' (solo ' + h.pocos + ' día'
           + (h.pocos === 1 ? '' : 's') + ' de datos)' : ''));
      // Sin title nativo: el globo da mas informacion y aparece al
      // instante, mientras que el del navegador tarda un segundo.

      col.appendChild(barra);
      col.dataset.i = i;
      grafica.appendChild(col);

      // Solo en hora en punto, y saltando horas si no caben.
      var etq = document.createElement('span');
      var enPunto = (h.m || 0) === 0;
      var rotula = enPunto && (h.h % cadaCuantas === 0);
      etq.textContent = rotula ? h.h : '';
      if (ahora) { etq.className = 'es-ahora'; }
      horas.appendChild(etq);
    });

    // Un solo par de manejadores en el contenedor en vez de uno por barra:
    // con 178 barras eso son 178 escuchadores que hay que volver a crear en
    // cada repintado.
    grafica.onmousemove = function (ev) {
      var col = ev.target.closest ? ev.target.closest('.col') : null;
      if (!col || col.dataset.i === undefined) { return; }
      mostrarGlobo(col, lista[+col.dataset.i], res);
    };
    grafica.onmouseleave = ocultarGlobo;
    // En movil no hay raton: al tocar se muestra igual.
    grafica.ontouchstart = function (ev) {
      var t = ev.touches[0];
      var e2 = document.elementFromPoint(t.clientX, t.clientY);
      var col = e2 && e2.closest ? e2.closest('.col') : null;
      if (col && col.dataset.i !== undefined) {
        mostrarGlobo(col, lista[+col.dataset.i], res);
      }
    };
  }

  var mirada = null;

  function textoGlobo(h, res) {
    var ini = ('0' + h.h).slice(-2) + ':' + ('0' + (h.m || 0)).slice(-2);
    var fin = h.h * 60 + (h.m || 0) + (res || 60);
    var ftxt = ('0' + Math.floor(fin / 60) % 24).slice(-2) + ':' +
               ('0' + fin % 60).slice(-2);
    var lineas = ['<b>' + ini + ' – ' + ftxt + '</b>'];
    lineas.push(NIVELES[h.n] || NIVELES[0]);
    // "pers" solo viene si se han pedido los numeros; si no, se informa en
    // relativo, que es lo unico que el panel publica por defecto.
    if (typeof h.pers === 'number') {
      var p = h.pers;
      lineas.push('<span class="gente">' +
                  (p === 1 ? '1 persona' : p.toFixed(1) + ' personas') +
                  '</span> de media');
    } else {
      lineas.push(h.rel + '% de lo más concurrido');
    }
    return lineas.join('<br>');
  }

  function mostrarGlobo(col, h, res) {
    var globo = el('globo');
    if (!globo) { return; }
    if (mirada && mirada !== col) { mirada.classList.remove('mirada'); }
    mirada = col;
    col.classList.add('mirada');
    globo.innerHTML = textoGlobo(h, res);
    globo.classList.add('visible');

    // Se coloca sobre la barra y se mantiene dentro de la tarjeta, para que
    // no se salga por los lados con las franjas de los extremos.
    var zona = el('zona-grafica');
    var rz = zona.getBoundingClientRect();
    var rc = col.getBoundingClientRect();
    var x = rc.left - rz.left + rc.width / 2 - globo.offsetWidth / 2;
    x = Math.max(0, Math.min(x, rz.width - globo.offsetWidth));
    globo.style.left = x + 'px';
    globo.style.top = Math.max(0, rc.top - rz.top - globo.offsetHeight - 6) + 'px';
  }

  function ocultarGlobo() {
    var globo = el('globo');
    if (globo) { globo.classList.remove('visible'); }
    if (mirada) { mirada.classList.remove('mirada'); mirada = null; }
  }

  function pintarAhora() {
    var a = datos.ahora || {n: 0, rel: 0, cmp: null};

    // Fuera del horario manda el horario: "Cerrado", y cuando vuelve a abrir.
    // Va antes que todo lo demas porque a esas horas el fichero es viejo A
    // PROPOSITO (el equipo duerme) y eso no es ninguna averia. Tampoco se
    // pinta el numero: seria el del cierre, no el de ahora.
    if (abiertoPorHorario() === false) {
      texto('ahora-txt', NIVELES[0]);
      el('ahora-bola').style.background = COLORES[0];
      texto('ahora-cmp', proximaApertura());
      texto('ahora-num', '');
      return;
    }

    // Si los datos estan viejos, el nivel NO se pinta.
    //
    // Con el equipo apagado o suspendido, el fichero se queda congelado con
    // el nivel de la ultima publicacion. Y el 0 ("Cerrado ahora") nunca
    // aparece ahi, porque el nivel minimo que se publica es 1 a proposito.
    // Resultado: a las tres de la madrugada el panel ensenaba "Poca gente" y,
    // con los numeros activados, "N personas", como si la sala estuviera
    // abierta. El aviso de abajo ya decia que los datos eran viejos, pero la
    // banda de color es lo primero que se mira y contaba otra cosa.
    //
    // Esto se decide AQUI, en la pagina, y no al publicar: cuando el equipo
    // esta apagado no hay nadie que publique nada, que es justo cuando hace
    // falta.
    // Tambien cuando el equipo dice que hay algo que revisar. Parece de
    // mas, pero no lo es: si la camara esta caida, el JSON se sigue
    // publicando con la hora fresca y el numero CONGELADO, asi que los
    // datos parecen de ahora y no lo son. Decir "no disponibles" y a la
    // vez pintar "Movido, 4 personas" seria contradecirse en la misma
    // pantalla.
    if (datosViejos() || aforoCaducado() || datos.estado === 'revisar') {
      // NO se dice "Cerrado": se dice que no se sabe. Con las etiquetas
      // puestas en este taller, NIVELES[0] es "Cerrado", asi que un equipo
      // apagado o sin publicar hacia que la pagina afirmara que la sala esta
      // cerrada cuando en realidad no tiene ni idea. El aviso de debajo
      // explica el motivo.
      texto('ahora-txt', 'No disponible');
      el('ahora-bola').style.background = '#8a94a3';
      texto('ahora-cmp', '');
      texto('ahora-num', '');
      return;
    }

    texto('ahora-txt', NIVELES[a.n] || NIVELES[0]);
    el('ahora-bola').style.background = COLORES[a.n] || COLORES[0];

    var frases = {
      '-1': 'Menos concurrida de lo habitual a esta hora.',
      '0':  'Lo habitual a esta hora.',
      '1':  'Más concurrida de lo habitual a esta hora.'
    };
    texto('ahora-cmp', a.cmp === null || a.cmp === undefined
      ? '' : (frases[String(a.cmp)] || ''));

    // El numero solo se pinta si viene en el JSON. No se decide aqui: si no
    // se ha pedido publicarlo, el campo no existe y no hay nada que ocultar.
    var p = datos.panel || {};
    if (p.mostrar_numeros && typeof datos.aforo === 'number') {
      texto('ahora-num', datos.aforo + (datos.aforo === 1 ? ' persona' : ' personas'));
    } else {
      texto('ahora-num', '');
    }
  }

  function pintar() {
    aplicarPanel(datos.panel);
    var p = datos.panel || {};
    texto('titulo', p.titulo || datos.sala || 'Aforo de la sala');
    document.title = (p.titulo || datos.sala || 'Aforo') + ' · Fluxus';

    var gen = datos.generado ? new Date(datos.generado) : null;
    var conSeg = (datos.panel || {}).mostrar_segundos;
    var fmtHora = conSeg
      ? {hour: '2-digit', minute: '2-digit', second: '2-digit'}
      : {hour: '2-digit', minute: '2-digit'};
    var sub = '';
    if (gen) {
      // El dia del reloj, no el de la jornada (datos.dia): a las 01:00 del
      // martes la jornada aun es la del lunes, pero "Lunes · actualizado a
      // las 01:00" se leeria como un dato de hace un dia.
      sub = NOMBRES[(gen.getDay() + 6) % 7] + ' · actualizado a las ' +
            gen.toLocaleTimeString('es-ES', fmtHora);
      if (conSeg && datos.ultimo_paso) {
        sub += ' · último paso ' + datos.ultimo_paso;
      }
    }
    texto('subtitulo', sub);

    // Si el fichero lleva mucho sin renovarse, el equipo puede estar apagado
    // o sin conexion: mas vale decirlo que mostrar algo viejo como si fuera
    // de ahora mismo.
    // El aviso cubre dos cosas distintas con el mismo sitio: que los datos
    // esten viejos (equipo apagado o sin conexion) y que el propio equipo
    // diga que hay algo que revisar. Lo segundo llega como un unico campo
    // "revisar", sin detalle: lo que la pagina puede decir es que el dato no
    // vale ahora mismo, no por que. El motivo esta en el informe privado.
    var aviso = el('aviso');
    // Cerrado por horario: ni "datos viejos" ni "revisar". El equipo duerme
    // porque toca, y decir "puede que este apagado" seria dar una alarma
    // cada noche y cada fin de semana.
    var cerrado = abiertoPorHorario() === false;
    var revisar = !cerrado && datos.estado === 'revisar';
    var viejo = !cerrado && (datosViejos() || aforoCaducado());
    // Recien abierto, el equipo aun se esta despertando: la primera
    // publicacion llega a los pocos minutos.
    var arrancando = viejo && abiertoPorHorario() === true &&
                     minutosDesdeApertura() < 20;
    aviso.classList.toggle('oculto', !viejo && !revisar);
    if (!viejo && revisar) {
      aviso.textContent = 'Datos no disponibles ahora mismo.';
    }
    if (arrancando) {
      aviso.textContent = 'El equipo se está poniendo en marcha; los datos '
        + 'de hoy llegan en unos minutos.';
    } else if (viejo) {
      // La hora que importa es la del ultimo dato de verdad, no la de
      // generacion del fichero: al republicar un informe, el fichero es de
      // ahora y el dato puede ser de hace un dia.
      // Sin ultimo_dato NO se pone la hora de generacion: es AHORA MISMO, y
      // el aviso acababa diciendo "no se actualizan desde las 15:25" en un
      // fichero recien escrito a las 15:25, con el subtitulo de arriba
      // diciendo "actualizado a las 15:25". Si no se sabe desde cuando, se
      // dice lo que se sabe y nada mas.
      var u = datos.ultimo_dato ? new Date(datos.ultimo_dato) : null;
      if (u && !isNaN(u.getTime())) {
        var mismoDia = u.toDateString() === new Date().toDateString();
        aviso.textContent = 'Estos datos no se actualizan desde ' +
          (mismoDia ? 'las ' : '') +
          u.toLocaleString('es-ES', mismoDia
            ? {hour: '2-digit', minute: '2-digit'}
            : {day: '2-digit', month: '2-digit', hour: '2-digit',
               minute: '2-digit'}) +
          '. Puede que el equipo esté apagado.';
      } else {
        aviso.textContent = 'El equipo no está enviando datos ahora mismo. '
          + 'Puede que esté apagado.';
      }
    }

    ajustarSemana();
    if (diaVisible === null) { diaVisible = diaInicial(); }
    pintarAhora();
    pintarSelector();
    pintarGrafica();
  }

  function cargar() {
    fetch('aforo.json?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) { throw new Error(r.status); }
        return r.json();
      })
      .then(function (d) { datos = d; pintar(); })
      .catch(function () {
        texto('subtitulo', 'No se han podido cargar los datos.');
      });
  }

  cargar();
  setInterval(cargar, 5 * 60 * 1000);
  window.addEventListener('resize', function () { if (datos) { pintarGrafica(); } });
})();
</script>
</body>
</html>
